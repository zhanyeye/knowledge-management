# Wiki 月度自动维护：decay（降级/归档）+ index（刷新索引）
# 内网环境用 GitLab CI 时，翻译成等价的 .gitlab-ci.yml 即可：
#   schedule 每天/每月触发 → python .wiki/scripts/wiki.py decay && python .wiki/scripts/wiki.py index
#   → git commit -am "auto: wiki decay" && git push
name: wiki-maintenance

on:
  schedule:
    - cron: "0 0 1 * *"   # 每月 1 号 00:00 UTC
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: decay + index
        run: |
          python .wiki/scripts/wiki.py decay
          python .wiki/scripts/wiki.py index
      - name: commit
        run: |
          git config user.name "wiki-bot"
          git config user.email "wiki-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || git commit -m "auto: wiki decay + index"
          git push
