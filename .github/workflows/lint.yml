name: lint
on:
  push:
    paths-ignore: ['设计方案/**', '.background/**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 结构/链接/manifest 治理
        run: python .knowhow/knowhow.py lint
      - name: 引擎单测
        run: python .knowhow/test_knowhow.py
